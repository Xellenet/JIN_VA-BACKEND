name: SonarQube Analysis

on:
  pull_request:
    branches:
      - develop
      - test
      - main

jobs:
  sonar:
    name: Run SonarQube Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # SonarQube Cloud needs the full history to tell new code from old.
          fetch-depth: 0

      # Node 24 "Krypton" LTS, supported until April 2028. A bare major picks
      # up the newest 24.x patch, including security releases, on every run.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true

      - name: Install dependencies
        run: npm install

      - name: Run tests with coverage
        run: npm run test:cov

      # sonarcloud-github-action is archived; this is SonarSource's
      # replacement and works the same way for SonarQube Cloud.
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Xellenet_JIN_VA-BACKEND
            -Dsonar.organization=xellenet
            -Dsonar.host.url=https://sonarcloud.io
